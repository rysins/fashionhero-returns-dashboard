name: Dashboard Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build runtime database and manifest
        run: python -m dashboard.pipeline

      - name: Validate dashboard snapshot
        run: python -m dashboard.validate_dashboard

      - name: Commit refreshed dashboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/fashionhero_dashboard.sqlite dashboard/data/pipeline_manifest.json
          git diff --cached --quiet || git commit -m "Refresh dashboard snapshot"
          git push
